# Damon agent core — example configuration
# Copy to the platform config dir (run `damond --print-config-path` to see it).
# .env files are loaded from the config dir, then cwd (existing env wins).
#
# Damon drives coding agents through their native CLIs — Claude Code,
# Codex CLI, Oh My Pi. Each backend brings its own login, models, and
# tools. If the CLIs are installed and logged in, NOTHING below is required.

# bind = "127.0.0.1:9470"          # default; changing requires restart
# auth_token = "env:DAMON_TOKEN"   # required for non-loopback binds

# Session store location (SQLite + FTS5) — defaults to the platform
# data dir (~/.local/share/damon, ~/Library/Application Support/…).
# data_dir = "/path/to/data"

# Backend selection when session.create omits `backend`:
# default_backend = "claude"

# Backend launch overrides — every field optional, catalog defaults otherwise.
# Catalog ids: claude, codex, omp, cursor, amp, kimi, qwen.
# [backends.claude]
# command = "claude"                       # or a local adapter build's path
# args = ["-p", "--output-format", "stream-json", "--input-format", "stream-json", "--verbose"]
# [backends.claude.env]
# ANTHROPIC_MODEL = "claude-sonnet-4-5"

# Any other agent CLI plugs in the same way (always available, no PATH check):
# [backends.my-agent]
# command = "/path/to/agent-cli"
# args = []
# [backends.my-agent.env]
# KEY = "value"

# MCP servers forwarded to every agent session at session.create time —
# the AGENT spawns and permissions them (Damon never launches them itself).
# [mcp_servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# permission_timeout_secs = 300   # deny agent permission asks after this
# session_retention_days = 30     # delete sessions older than this; unset = keep forever
# agent_idle_secs = 1800          # idle backend sessions are closed after this;
                                  # sessions reattach via the resume chain; 0 = disabled

# Remote relay — dial out so clients can reach this daemon without an
# inbound port. Run damon-relay on a public host first.
# [relay]
# url = "ws://your-relay:8080"
# name = "my-daemon"
# secret = "env:DAMON_RELAY_SECRET"   # when the relay requires one

# TLS — serve wss instead of ws.
# tls_cert = "/path/to/cert.pem"
# tls_key = "/path/to/key.pem"
