name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The declared MSRV (Cargo.toml rust-version) and the pinned
      # toolchain must stay in lockstep — a silent drift would let PRs
      # pass on a newer rustc than the floor users build with.
      - name: Declared MSRV matches the pinned toolchain
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          pin=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          [ "${pin%.*}" = "$msrv" ] || {
            echo "Cargo.toml rust-version=$msrv but rust-toolchain.toml pins $pin" >&2
            exit 1
          }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # npm client tests, Linux leg only — one OS covers a
      # dependency-free script. node:test is built in and client.mjs
      # has no dependencies, so no `npm install` is needed either.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"
      - name: npm client tests
        if: runner.os == 'Linux'
        working-directory: npm
        run: npm test
      # Python client tests, Linux leg only — same one-OS rationale as
      # the npm client tests above.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.13"
      - name: Python client tests
        if: runner.os == 'Linux'
        run: pip install -e 'python[dev]' && pytest python/tests
      # Release-only code paths (cfg(not(debug_assertions))) get no
      # compile coverage from a debug test run — check them explicitly.
      - run: cargo check --release --all-targets
      # Channel binaries and the CLI share no test coverage — a --help
      # smoke on every OS catches link/startup regressions (e.g. a
      # missing native dep on Windows) that `cargo test` can't see.
      - name: Binary smoke (--help on every shipped binary)
        shell: bash
        run: |
          for b in damond damon damon-relay damon-telegram damon-discord damon-slack; do
            exe="./target/debug/$b"
            [ -f "$exe.exe" ] && exe="$exe.exe"
            "$exe" --help >/dev/null || { echo "$b --help failed"; exit 1; }
          done

  audit:
    # Direct cargo-audit instead of rustsec/audit-check: that image pins a
    # rustc older than current cargo-audit dependency MSRVs (kstring 2.0.5
    # requires 1.96), so its unlocked install cannot compile. --locked uses
    # cargo-audit's own lockfile, which is 1.95-compatible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit, deny, coverage]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # GitHub's native ARM64 runner: building aarch64 natively
          # sidesteps the libdbus cross-compilation (gcc-aarch64 +
          # PKG_CONFIG sysroot juggling for keyring's
          # sync-secret-service) an x86_64-hosted build would need.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag matches manifest versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_v=$(node -p "require('./npm/package.json').version" 2>/dev/null || grep -m1 '"version"' npm/package.json | cut -d'"' -f4)
          formula_v=$(grep -m1 '^  version ' Formula/damon.rb | cut -d'"' -f2)
          echo "tag=$tag cargo=$cargo_v npm=$npm_v formula=$formula_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$npm_v" ] && [ "$tag" = "$formula_v" ] || {
            echo "tag v$tag does not match manifest versions" >&2; exit 1;
          }
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../damon-${{ matrix.target }}.tar.gz --exclude='*.d' --exclude='*.pdb' damond* damon*
          cd ../../..
          # Git Bash has no shasum but ships sha256sum; macOS is the
          # reverse. Both emit "<hash>  <file>".
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum damon-${{ matrix.target }}.tar.gz > damon-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 damon-${{ matrix.target }}.tar.gz > damon-${{ matrix.target }}.tar.gz.sha256
          fi
          ls -la damon-*.tar.gz*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: damon-*.tar.gz*
      - name: Update Formula sha256
        # One leg only: rewrite Formula/damon.rb from the published tarballs
        # and push to the default branch. Fails loudly if the tag commit is
        # not the branch head (non-fast-forward push).
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          targets="aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
          tmp="$(mktemp -d)"

          sed -i "s/^  version \".*\"/  version \"$version\"/" Formula/damon.rb
          for target in $targets; do
            # The release CDN can serve a stale tarball right after the
            # assets are replaced (observed on v0.2.0). The published
            # .sha256 asset is computed by the build leg from the exact
            # artifact it uploaded, so a mismatch means we cached a
            # previous build — wait and re-download.
            curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL "$base/damon-$target.tar.gz.sha256" -o "$tmp/$target.published"
            for attempt in 1 2 3 4 5; do
              curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL "$base/damon-$target.tar.gz" -o "$tmp/$target.tar.gz"
              computed="$(sha256sum "$tmp/$target.tar.gz" | cut -d' ' -f1)"
              published="$(cut -d' ' -f1 < "$tmp/$target.published")"
              [ "$computed" = "$published" ] && break
              echo "sha256 mismatch for $target (attempt $attempt): CDN served a stale asset, retrying" >&2
              sleep 20
            done
            [ "$computed" = "$published" ] || {
              echo "computed $computed != published $published for $target after 5 attempts" >&2; exit 1;
            }
            echo "$computed" > "$tmp/$target.sha256"
          done
          for target in $targets; do
            awk -v t="$target" -v s="$(cat "$tmp/$target.sha256")" '
              index($0, "damon-" t ".tar.gz") { url=1 }
              url && /^ *sha256 / { sub(/"[0-9a-fA-F]*"/, "\"" s "\""); url=0 }
              { print }
            ' Formula/damon.rb > Formula/damon.rb.tmp && mv Formula/damon.rb.tmp Formula/damon.rb
          done
          for target in $targets; do
            grep -q "sha256 \"$(cat "$tmp/$target.sha256")\"" Formula/damon.rb || {
              echo "sha256 for $target not updated in Formula/damon.rb" >&2; exit 1;
            }
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/damon.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${tag}"
          else
            git commit -m "chore(formula): sha256 for ${tag}"
            git push origin "HEAD:${DEFAULT_BRANCH:-main}"
          fi

      # Runs on the same leg as the Formula pass, which already
      # verified every tarball against its build-computed .sha256 —
      # the manifest is assembled from those verified hashes. With
      # MINISIGN_SECRET_KEY registered (minisign/rsign secret key,
      # passwordless — see docs/release.md) the manifest is signed
      # minisign-style; until then it ships unsigned with a warning,
      # and scripts/verify-release.sh treats a missing signature as
      # advisory unless --require-signature is passed.
      - name: Publish SHA256SUMS manifest (+ minisign signature)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          targets="aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
          tmp="$(mktemp -d)"
          : > SHA256SUMS
          for target in $targets; do
            curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL \
              "$base/damon-$target.tar.gz.sha256" -o "$tmp/$target.published"
            printf '%s  damon-%s.tar.gz\n' "$(cut -d' ' -f1 < "$tmp/$target.published")" "$target" >> SHA256SUMS
          done
          cat SHA256SUMS
          assets=(SHA256SUMS)
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            cargo install rsign2 --locked
            key="$(mktemp)"; printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
            rsign sign -s "$key" -x SHA256SUMS.minisig -W SHA256SUMS
            rm -f "$key"
            assets+=(SHA256SUMS.minisig)
          else
            echo "::warning::MINISIGN_SECRET_KEY is not registered — publishing SHA256SUMS without a signature (see docs/release.md)"
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

  deny:
    # cargo-deny gates licenses/bans/sources. Advisories are
    # deliberately not checked here: the audit job above already runs
    # cargo-audit against the same lockfile (with the pinned-toolchain
    # --locked rationale in its comment), so `deny check advisories`
    # would be redundant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses bans sources

  coverage:
    # Separate job instead of a test-matrix step: instrumented builds
    # would roughly double the test legs' time. The line-coverage floor
    # (measured 63.5% at introduction) gates the release: erosion shows
    # up here instead of shipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info


  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Sigstore provenance: npm publish --provenance needs an OIDC
      # token so the package attestation links back to this run.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
