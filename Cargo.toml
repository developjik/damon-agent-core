[package]
name = "damon-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Damon agent core — local multi-provider agent daemon"
repository = "https://github.com/developjik/damon-agent-core"
keywords = ["agent", "llm", "daemon", "mcp", "acp"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
parking_lot = "0.12"
notify = "8"
rmcp = { version = "3.3.0", default-features = false, features = ["client", "transport-child-process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-rusqlite = "0.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
tokio-tungstenite = "0.30.0"
dotenvy = "0.15"
wait-timeout = "0.2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
rand_core = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"


tokio-util = "0.7.19"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.45", features = ["ring"] }


[dev-dependencies]
sysinfo = "0.33"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14.10"


[features]
default = []
